name: Deploy existing Azure App Service
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package Next.js standalone server
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .next/standalone
      - name: Verify public application and intelligence status
        env:
          APP_URL: ${{ vars.AZURE_WEBAPP_URL }}
        run: |
          test -n "$APP_URL"
          curl --fail --retry 8 --retry-delay 10 --retry-all-errors "$APP_URL" -o /tmp/second-look-deployed.html
          grep -q 'Second Look' /tmp/second-look-deployed.html
          curl --fail --retry 3 "$APP_URL/api/insights"
